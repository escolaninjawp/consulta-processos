[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consulta-processos"
version = "0.1.0"
description = "Busca e consulta de processos judiciais brasileiros nas fontes públicas (Datajud e DJEN/Comunica do CNJ)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["direito", "juridico", "processos", "cnj", "datajud", "djen", "tribunais"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Muito recomendado em produção: imita a impressão digital TLS de navegadores reais,
# o que evita bloqueios nas APIs públicas quando o volume cresce.
navegador = ["curl-cffi>=0.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
consulta-processos = "consulta_processos.cli:main"

[tool.setuptools.packages.find]
include = ["consulta_processos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
# Capturar Exception é proposital na camada de rede: a consulta cai para o próximo
# proxy/fonte em vez de derrubar o programa de quem chamou.
ignore = ["B904", "RUF001", "RUF002", "RUF003"]
